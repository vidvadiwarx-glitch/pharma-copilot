<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pharma Copilot</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f3ff;
    }

    h1 {
      text-align: center;
    }

    button {
      padding: 15px 25px;
      margin: 5px;
      font-size: 18px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
    }

    #startBtn {
      background: #6c4ab6;
      color: white;
    }

    #stopBtn {
      background: #999;
      color: white;
    }

    #status {
      margin: 20px 0;
      padding: 15px;
      background: white;
      border-radius: 10px;
      font-size: 18px;
    }

    #transcript {
      margin-top: 20px;
      padding: 20px;
      min-height: 200px;
      background: white;
      border-radius: 10px;
      font-size: 20px;
      line-height: 1.8;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <h1>💊 Pharma Copilot</h1>

  <div style="text-align:center;">
    <button id="startBtn">🎙️ START</button>
    <button id="stopBtn" disabled>⏹️ STOP</button>
  </div>

  <div id="status">
    สถานะ: ยังไม่ได้เริ่ม
  </div>

  <div id="transcript">
    ข้อความที่ได้ยินจะขึ้นตรงนี้...
  </div>

<script>

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const statusBox = document.getElementById("status");
const transcriptBox = document.getElementById("transcript");

if (!SpeechRecognition) {

  statusBox.innerText =
    "❌ Browser ไม่รองรับ Speech Recognition";

} else {

  const recognition = new SpeechRecognition();

  recognition.lang = "th-TH";
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  let isListening = false;
  let finalText = "";


  // =========================
  // กด START
  // =========================

  startBtn.onclick = () => {

    finalText = "";
    transcriptBox.innerText = "";

    isListening = true;

    statusBox.innerText =
      "🟡 กำลังเปิดระบบรับเสียง...";

    startBtn.disabled = true;
    stopBtn.disabled = false;

    try {

      recognition.start();

    } catch (e) {

      console.log("START ERROR:", e);

    }

  };


  // =========================
  // เริ่มรับเสียง
  // =========================

  recognition.onstart = () => {

    console.log("ONSTART");

    statusBox.innerText =
      "🟢 ไมค์กำลังฟังอยู่ — ลองพูดว่า สวัสดีค่ะ";

  };


  // =========================
  // ได้ผลการรู้จำเสียง
  // =========================

  recognition.onresult = (event) => {

    console.log("ONRESULT", event);

    let interimText = "";

    for (
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ) {

      const transcript =
        event.results[i][0].transcript;

      console.log(
        "เสียงที่จับได้:",
        transcript
      );

      if (event.results[i].isFinal) {

        finalText += transcript + " ";

      } else {

        interimText += transcript;

      }

    }

    transcriptBox.innerText =
      finalText + interimText;

    statusBox.innerText =
      "🟢 ได้ยินเสียงแล้ว";

  };


  // =========================
  // ERROR
  // =========================

  recognition.onerror = (event) => {

    console.error(
      "SPEECH ERROR:",
      event.error
    );

    statusBox.innerText =
      "❌ Speech Error: " + event.error;

  };


  // =========================
  // หยุด
  // =========================

  stopBtn.onclick = () => {

    isListening = false;

    recognition.stop();

    statusBox.innerText =
      "⏹️ หยุดรับเสียงแล้ว";

    startBtn.disabled = false;
    stopBtn.disabled = true;

  };


  // =========================
  // Recognition หยุดเอง
  // =========================

  recognition.onend = () => {

    console.log("ONEND");

    if (isListening) {

      statusBox.innerText =
        "🔄 ระบบหยุดชั่วคราว กำลังเปิดใหม่...";

      setTimeout(() => {

        try {

          recognition.start();

        } catch (e) {

          console.log(
            "RESTART ERROR:",
            e
          );

        }

      }, 500);

    }

  };

}

</script>

</body>
</html>
