<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pharma Copilot</title>

<style>

body {
  font-family: Arial, sans-serif;
  background: #f5f3ff;
  margin: 0;
  padding: 30px;
}

.container {
  max-width: 900px;
  margin: auto;
  background: white;
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

h1 {
  text-align: center;
}

h2 {
  margin-top: 30px;
}

button {
  padding: 12px 20px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  margin: 5px;
  font-size: 16px;
}

#startBtn {
  background: #6c5ce7;
  color: white;
}

#stopBtn {
  background: #d63031;
  color: white;
}

#nextBtn {
  background: #0984e3;
  color: white;
}

#statusBox {
  margin-top: 15px;
  padding: 15px;
  background: #eee;
  border-radius: 10px;
}

#transcript {
  margin-top: 20px;
  padding: 20px;
  background: #fafafa;
  border: 1px solid #ddd;
  border-radius: 10px;
  min-height: 120px;
  white-space: pre-wrap;
}

.checklist {
  margin-top: 20px;
}

.item {
  padding: 10px;
  margin: 5px 0;
  border-radius: 8px;
  background: #f1f2f6;
}

.done {
  background: #dff9fb;
}

.missing {
  background: #ffeaa7;
}

.score {
  font-size: 20px;
  font-weight: bold;
  margin-top: 20px;
}

</style>
</head>


<body>

<div class="container">

<h1>💊 Pharma Copilot</h1>

<p>
ระบบช่วยตรวจสอบความครบถ้วนในการซักประวัติและให้คำแนะนำยา
</p>


<!-- ========================= -->
<!-- BUTTON -->
<!-- ========================= -->

<button id="startBtn">
🎙️ เริ่มบันทึกเสียง
</button>

<button id="stopBtn">
⏹ หยุดบันทึก
</button>

<button id="nextBtn">
➡️ NEXT
</button>


<div id="statusBox">
สถานะ: พร้อมใช้งาน
</div>


<!-- ========================= -->
<!-- TRANSCRIPT -->
<!-- ========================= -->

<h2>📝 Transcript</h2>

<div id="transcript">
ยังไม่มีข้อความ
</div>


<!-- ========================= -->
<!-- CHECKLIST -->
<!-- ========================= -->

<h2>📋 History Checklist</h2>

<div id="historyChecklist" class="checklist"></div>


<div class="score" id="historyScore">
History Score: -
</div>


<h2>💊 Counseling Checklist</h2>

<div id="counselingChecklist" class="checklist"></div>


<div class="score" id="counselingScore">
Counseling Score: -
</div>


</div>


<script>


// =====================================================
// APPS SCRIPT API
// =====================================================

const API_URL =
"https://script.google.com/macros/s/AKfycby-1f6yKecrhwL6zphf8qiyWlt5lCY_E8RMAZhNB9RwyfZbNy_bQ7a0JS2jubMfQgE9qA/exec";


// =====================================================
// CHECKLIST
// =====================================================

const historyChecklist = [

{
id:"H01",
name:"ใครคือผู้ป่วย",
keywords:["ชื่อ","ผู้ป่วย","คนไข้"]
},

{
id:"H02",
name:"อายุ",
keywords:["อายุ","กี่ปี"]
},

{
id:"H03",
name:"น้ำหนัก",
keywords:["น้ำหนัก","หนักกี่กิโล"]
},

{
id:"H04",
name:"เพศ / ตั้งครรภ์ / ให้นมบุตร",
keywords:[
"เพศ",
"ผู้ชาย",
"ผู้หญิง",
"ตั้งครรภ์",
"ท้อง",
"ให้นม"
]
},

{
id:"H05",
name:"วันนี้มาด้วยโรคหรืออาการอะไร",
keywords:[
"เป็นอะไร",
"มีอาการอะไร",
"อาการอะไร",
"มาด้วยอาการ"
]
},

{
id:"H06",
name:"เริ่มมีอาการเมื่อไร / เป็นมานานเท่าไร",
keywords:[
"เป็นมานาน",
"เริ่มเป็น",
"เป็นตั้งแต่",
"กี่วัน",
"เมื่อไร"
]
},

{
id:"H07",
name:"ความรุนแรงเทียบกับวันแรก",
keywords:[
"รุนแรง",
"หนักขึ้น",
"ดีขึ้น",
"แย่ลง",
"เทียบกับวันแรก"
]
},

{
id:"H08",
name:"เคยมีอาการเช่นนี้มาก่อน",
keywords:[
"เคยเป็น",
"เคยมีอาการ",
"มาก่อน"
]
},

{
id:"H09",
name:"มีอาการอื่นร่วม",
keywords:[
"อาการร่วม",
"มีอาการอื่น",
"ร่วมด้วย"
]
},

{
id:"H10",
name:"สิ่งที่ทำให้อาการแย่ลง",
keywords:[
"แย่ลง",
"กระตุ้น",
"ทำให้อาการมากขึ้น"
]
},

{
id:"H11",
name:"สิ่งที่ทำให้อาการดีขึ้น",
keywords:[
"ดีขึ้น",
"บรรเทา",
"ทำให้อาการดีขึ้น"
]
},

{
id:"H12",
name:"โรคประจำตัว / ยาที่ได้รับ",
keywords:[
"โรคประจำตัว",
"ยาประจำ",
"กินยาอะไร",
"ยาที่ใช้"
]
},

{
id:"H13",
name:"บุหรี่ / แอลกอฮอล์",
keywords:[
"สูบบุหรี่",
"บุหรี่",
"ดื่มเหล้า",
"แอลกอฮอล์",
"สุรา"
]
},

{
id:"H14",
name:"ยา/ผลิตภัณฑ์ที่ใช้บรรเทาอาการ",
keywords:[
"เคยกินยา",
"ใช้ยาอะไร",
"ซื้อยากิน",
"ใช้ผลิตภัณฑ์"
]
},

{
id:"H15",
name:"ประวัติแพ้ยา/สิ่งอื่น",
keywords:[
"แพ้ยา",
"แพ้อะไร",
"ประวัติแพ้",
"แพ้อาหาร"
]
},

{
id:"H16",
name:"เคยใช้ยานี้และมีอาการไม่พึงประสงค์",
keywords:[
"เคยใช้ยานี้",
"เคยกินยานี้",
"ผลข้างเคียง",
"อาการไม่พึงประสงค์"
]
}

];


const counselingChecklist = [

{
id:"C01",
name:"วิธีใช้ยา",
keywords:[
"วิธีใช้",
"วิธีกิน",
"กินครั้งละ",
"หลังอาหาร",
"ก่อนอาหาร"
]
},

{
id:"C02",
name:"ผลข้างเคียง",
keywords:[
"ผลข้างเคียง",
"อาการข้างเคียง",
"อาการไม่พึงประสงค์"
]
},

{
id:"C03",
name:"การเก็บรักษา",
keywords:[
"เก็บยา",
"การเก็บรักษา",
"เก็บไว้",
"อุณหภูมิ"
]
},

{
id:"C04",
name:"การรักษาโดยไม่ใช้ยา / ดูแลตนเอง",
keywords:[
"ดูแลตัวเอง",
"ดูแลตนเอง",
"ไม่ใช้ยา",
"พักผ่อน",
"ดื่มน้ำ"
]
}

];


// =====================================================
// SPEECH RECOGNITION
// =====================================================

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


let recognition;

let finalText = "";

let isListening = false;


if (!SpeechRecognition) {

alert(
"Browser นี้ไม่รองรับ Speech Recognition\nกรุณาใช้ Google Chrome"
);

}
else {

recognition =
new SpeechRecognition();

recognition.lang =
"th-TH";

recognition.continuous =
true;

recognition.interimResults =
true;

recognition.maxAlternatives =
1;


recognition.onstart =
function() {

isListening = true;

statusBox.innerText =
"🎙️ กำลังฟัง...";

};


recognition.onresult =
function(event) {

let interimText = "";

for (
let i = event.resultIndex;
i < event.results.length;
i++
) {

const text =
event.results[i][0].transcript;


if (
event.results[i].isFinal
) {

finalText +=
text + " ";

}
else {

interimText +=
text;

}

}


document.getElementById(
"transcript"
).innerText =
finalText + interimText;

};


recognition.onerror =
function(event) {

console.error(
"Speech error:",
event.error
);

statusBox.innerText =
"⚠️ Speech error: " +
event.error;

};


recognition.onend =
function() {

isListening = false;

statusBox.innerText =
"⏹ หยุดฟังแล้ว";

};

}


// =====================================================
// START
// =====================================================

document.getElementById("startBtn")
.onclick =
function() {

if (!recognition)
return;

finalText = "";

document.getElementById(
"transcript"
).innerText =
"กำลังฟัง...";

recognition.start();

};


// =====================================================
// STOP
// =====================================================

document.getElementById("stopBtn")
.onclick =
function() {

if (!recognition)
return;

recognition.stop();

};


// =====================================================
// DISPLAY CHECKLIST
// =====================================================

function displayChecklist(
list,
containerId
) {

const container =
document.getElementById(
containerId
);

container.innerHTML = "";


list.forEach(
function(item) {

const div =
document.createElement("div");

div.className =
"item";

div.id =
item.id;

div.innerHTML =
"⬜ " +
item.id +
" — " +
item.name;

container.appendChild(div);

});

}


displayChecklist(
historyChecklist,
"historyChecklist"
);

displayChecklist(
counselingChecklist,
"counselingChecklist"
);


// =====================================================
// CHECK CHECKLIST
// =====================================================

function checkChecklist(text) {

const lowerText =
text.toLowerCase();


let historyDone = 0;

let counselingDone = 0;

let missingHistory = [];

let missingCounseling = [];


historyChecklist.forEach(
function(item) {

const found =
item.keywords.some(
function(keyword) {

return lowerText.includes(
keyword.toLowerCase()
);

});


const element =
document.getElementById(
item.id
);


if (found) {

historyDone++;

element.className =
"item done";

element.innerHTML =
"✅ " +
item.id +
" — " +
item.name;

}
else {

missingHistory.push(
item.id +
" — " +
item.name
);

element.className =
"item missing";

element.innerHTML =
"⚠️ " +
item.id +
" — " +
item.name;

}

});


counselingChecklist.forEach(
function(item) {

const found =
item.keywords.some(
function(keyword) {

return lowerText.includes(
keyword.toLowerCase()
);

});


const element =
document.getElementById(
item.id
);


if (found) {

counselingDone++;

element.className =
"item done";

element.innerHTML =
"✅ " +
item.id +
" — " +
item.name;

}
else {

missingCounseling.push(
item.id +
" — " +
item.name
);

element.className =
"item missing";

element.innerHTML =
"⚠️ " +
item.id +
" — " +
item.name;

}

});


const historyScore =
Math.round(
(historyDone /
historyChecklist.length) * 100
);


const counselingScore =
Math.round(
(counselingDone /
counselingChecklist.length) * 100
);


document.getElementById(
"historyScore"
).innerText =
"History Score: " +
historyScore +
"%";


document.getElementById(
"counselingScore"
).innerText =
"Counseling Score: " +
counselingScore +
"%";


return {

historyScore:
historyScore,

counselingScore:
counselingScore,

missingHistory:
missingHistory,

missingCounseling:
missingCounseling

};

}


// =====================================================
// SAVE TO GOOGLE SHEETS
// =====================================================

function saveToGoogleSheet(

transcript,
historyScore,
counselingScore,
missingHistory,
missingCounseling

) {

const sessionId =
"S" + Date.now();


const params =
new URLSearchParams({

action:"save",

callback:"pharmaCallback",

sessionId:
sessionId,

transcript:
transcript,

historyScore:
historyScore,

counselingScore:
counselingScore,

missingHistory:
missingHistory.join(" | "),

missingCounseling:
missingCounseling.join(" | ")

});


window.pharmaCallback =
function(response) {

console.log(
"Apps Script response:",
response
);

if (response.success) {

statusBox.innerText =
"✅ บันทึกข้อมูลลง Google Sheets แล้ว";

}

};


const script =
document.createElement("script");


script.src =
API_URL +
"?" +
params.toString();


script.onload =
function() {

console.log(
"ส่งข้อมูลไป Apps Script สำเร็จ"
);

script.remove();

};


script.onerror =
function() {

console.error(
"ส่งข้อมูลไป Apps Script ไม่สำเร็จ"
);

statusBox.innerText =
"⚠️ ไม่สามารถบันทึก Google Sheets";

script.remove();

};


document.body.appendChild(
script
);

}


// =====================================================
// NEXT BUTTON
// =====================================================

document.getElementById("nextBtn")
.onclick =
function() {


if (!finalText.trim()) {

alert(
"ยังไม่มีข้อความเสียง"
);

return;

}


statusBox.innerText =
"🔍 กำลังตรวจสอบข้อมูล...";


const result =
checkChecklist(
finalText
);


console.log(
"CHECK RESULT:",
result
);


// =========================
// SAVE
// =========================

saveToGoogleSheet(

finalText,

result.historyScore,

result.counselingScore,

result.missingHistory,

result.missingCounseling

);


statusBox.innerText =
"📊 ตรวจสอบเสร็จแล้ว กำลังบันทึกข้อมูล...";

};

</script>

</body>
</html>
