<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pharma Copilot</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f3ff;
    }

    h1 {
      text-align: center;
    }

    button {
      padding: 15px 25px;
      margin: 5px;
      font-size: 18px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
    }

    #startBtn {
      background: #6c4ab6;
      color: white;
    }

    #stopBtn {
      background: #999;
      color: white;
    }

    #status {
      margin: 20px 0;
      padding: 15px;
      background: white;
      border-radius: 10px;
      font-size: 18px;
    }

    #transcript {
      margin-top: 20px;
      padding: 20px;
      min-height: 200px;
      background: white;
      border-radius: 10px;
      font-size: 20px;
      line-height: 1.8;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <h1>💊 Pharma Copilot</h1>

  <div style="text-align:center;">
    <button id="startBtn">🎙️ START</button>
    <button id="stopBtn" disabled>⏹️ STOP</button>
  </div>

  <div id="status">
    สถานะ: ยังไม่ได้เริ่ม
  </div>

  <div id="transcript">
    ข้อความที่ได้ยินจะขึ้นตรงนี้...
  </div>

<script>

const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const statusBox = document.getElementById("status");
const transcriptBox = document.getElementById("transcript");

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

if (!SpeechRecognition) {

  statusBox.innerHTML =
    "❌ Browser นี้ไม่รองรับ Speech Recognition";

} else {

  const recognition = new SpeechRecognition();

  recognition.lang = "th-TH";

  recognition.continuous = true;

  recognition.interimResults = true;

  recognition.maxAlternatives = 1;


  let listening = false;


  // =========================
  // START
  // =========================

  startBtn.onclick = function() {

    console.log("START clicked");

    listening = true;

    transcriptBox.innerText = "";

    statusBox.innerText =
      "🎙️ กำลังฟัง... พูดได้เลย";

    startBtn.disabled = true;

    stopBtn.disabled = false;

    try {

      recognition.start();

    } catch (error) {

      console.log(error);

    }

  };


  // =========================
  // เมื่อเริ่มฟัง
  // =========================

  recognition.onstart = function() {

    console.log("Recognition started");

    statusBox.innerText =
      "🟢 กำลังฟังเสียง...";

  };


  // =========================
  // รับคำพูด
  // =========================

  recognition.onresult = function(event) {

    console.log("RESULT EVENT");

    let text = "";

    for (
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ) {

      text += event.results[i][0].transcript;

    }

    console.log("ได้ข้อความ:", text);

    transcriptBox.innerText = text;

    statusBox.innerText =
      "🟢 ได้ยิน: " + text;

  };


  // =========================
  // ERROR
  // =========================

  recognition.onerror = function(event) {

    console.log(
      "Speech error:",
      event.error
    );

    statusBox.innerText =
      "❌ Error: " + event.error;

  };


  // =========================
  // STOP
  // =========================

  stopBtn.onclick = function() {

    console.log("STOP clicked");

    listening = false;

    recognition.stop();

    statusBox.innerText =
      "⏹️ หยุดฟังแล้ว";

    startBtn.disabled = false;

    stopBtn.disabled = true;

  };


  // =========================
  // END
  // =========================

  recognition.onend = function() {

    console.log("Recognition ended");

    if (listening) {

      statusBox.innerText =
        "🔄 กำลังเริ่มฟังใหม่...";

      setTimeout(function() {

        try {

          recognition.start();

        } catch (error) {

          console.log(error);

        }

      }, 300);

    }

  };

}

</script>

</body>
</html>
