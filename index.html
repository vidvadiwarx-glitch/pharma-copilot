<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Pharma Copilot</title>

<style>

body {
  font-family: Arial, sans-serif;
  max-width: 1000px;
  margin: auto;
  padding: 25px;
  background: #f5f3ff;
}

h1 {
  text-align: center;
  color: #5b3b95;
}

h2 {
  color: #5b3b95;
}

.card {
  background: white;
  padding: 20px;
  margin-top: 20px;
  border-radius: 15px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

button {
  padding: 13px 25px;
  margin: 5px;
  border: none;
  border-radius: 10px;
  font-size: 17px;
  cursor: pointer;
}

#startBtn {
  background: #6c4ab6;
  color: white;
}

#stopBtn {
  background: #999;
  color: white;
}

#nextBtn {
  background: #4caf50;
  color: white;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

#status {
  padding: 15px;
  margin-top: 15px;
  border-radius: 10px;
  background: #eee;
  font-size: 18px;
}

#transcript {
  min-height: 150px;
  padding: 15px;
  background: #fafafa;
  border-radius: 10px;
  line-height: 1.8;
  font-size: 18px;
  white-space: pre-wrap;
}

.check-item {
  padding: 12px;
  margin: 7px 0;
  border-radius: 8px;
  background: #eee;
}

.done {
  background: #d9f5df;
}

.missing {
  background: #ffe0e0;
}

.score {
  font-size: 22px;
  font-weight: bold;
  margin: 15px 0;
}

.small {
  color: #666;
  font-size: 14px;
}

</style>

</head>


<body>


<h1>💊 Pharma Copilot</h1>


<!-- ========================= -->
<!-- CONTROL -->
<!-- ========================= -->

<div class="card">

<h2>🎙️ การสนทนา</h2>

<button id="startBtn">
🎙️ START
</button>

<button id="stopBtn" disabled>
⏹️ STOP
</button>

<button id="nextBtn" disabled>
➡️ NEXT
</button>

<div id="status">
สถานะ: ยังไม่ได้เริ่ม
</div>

</div>


<!-- ========================= -->
<!-- TRANSCRIPT -->
<!-- ========================= -->

<div class="card">

<h2>📝 ข้อความที่ระบบจับได้</h2>

<div id="transcript">
ยังไม่มีข้อความ
</div>

</div>


<!-- ========================= -->
<!-- HISTORY CHECKLIST -->
<!-- ========================= -->

<div class="card">

<h2>📋 Checklist การซักประวัติ</h2>

<div id="historyChecklist"></div>

<div id="historyScore"
class="score">
คะแนน: 0 / 16
</div>

</div>


<!-- ========================= -->
<!-- COUNSELING -->
<!-- ========================= -->

<div class="card">

<h2>💊 Checklist คำแนะนำยา</h2>

<div id="counselingChecklist"></div>

<div id="counselingScore"
class="score">
คะแนน: 0 / 4
</div>

</div>


<!-- ========================= -->
<!-- RESULT -->
<!-- ========================= -->

<div class="card">

<h2>📊 ผลการตรวจสอบ</h2>

<div id="result">
ยังไม่มีผลการตรวจสอบ
</div>

</div>



<script>


/* =====================================================
   APPS SCRIPT URL
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbz7KRPTS__BZKxORoDi42W4DAVCEyMekpQg8X--vbLsTUkmR6Xud4Hmu1kZnPFtZ6QobA/exec";



/* =====================================================
   HISTORY CHECKLIST H01-H16
===================================================== */

const historyChecklist = [

{
id:"H01",
name:"ใครคือผู้ป่วย",
keywords:[
"ชื่อ",
"ผู้ป่วย",
"คนไข้",
"ชื่ออะไร",
"ชื่ออะไรคะ",
"ชื่ออะไรครับ"
]
},

{
id:"H02",
name:"อายุ",
keywords:[
"อายุ",
"กี่ปี",
"อายุเท่าไหร่",
"อายุเท่าไร"
]
},

{
id:"H03",
name:"น้ำหนัก",
keywords:[
"น้ำหนัก",
"หนักกี่กิโล",
"หนักเท่าไหร่",
"หนักเท่าไร",
"กี่กิโล"
]
},

{
id:"H04",
name:"เพศ / ตั้งครรภ์ / ให้นมบุตร",
keywords:[
"เพศ",
"ผู้ชาย",
"ผู้หญิง",
"ตั้งครรภ์",
"ท้อง",
"ตั้งท้อง",
"ให้นม",
"ให้นมลูก"
]
},

{
id:"H05",
name:"วันนี้มาด้วยโรคหรืออาการอะไร",
keywords:[
"เป็นอะไร",
"มีอาการอะไร",
"อาการอะไร",
"มาด้วยอาการ",
"วันนี้เป็นอะไร"
]
},

{
id:"H06",
name:"เริ่มมีอาการเมื่อไร / เป็นมานานเท่าไร",
keywords:[
"เป็นมานาน",
"เริ่มเป็น",
"เป็นตั้งแต่",
"กี่วัน",
"เมื่อไร",
"เป็นมากี่วัน",
"เป็นตั้งแต่วันไหน",
"เป็นมานานแค่ไหน"
]
},

{
id:"H07",
name:"ความรุนแรงของอาการเทียบกับวันแรก",
keywords:[
"รุนแรง",
"หนักขึ้น",
"ดีขึ้น",
"แย่ลง",
"เทียบกับวันแรก",
"ต่างกันไหม",
"ตอนนี้กับวันแรก"
]
},

{
id:"H08",
name:"เคยมีอาการเช่นนี้มาก่อน",
keywords:[
"เคยเป็น",
"เคยมีอาการ",
"มาก่อน",
"เคยเป็นมาก่อน"
]
},

{
id:"H09",
name:"มีอาการอื่นร่วม",
keywords:[
"อาการร่วม",
"มีอาการอื่น",
"ร่วมด้วย",
"อาการอื่นร่วม"
]
},

{
id:"H10",
name:"สิ่งที่ทำให้อาการแย่ลง",
keywords:[
"แย่ลง",
"อาการแย่ลง",
"กระตุ้น",
"ทำให้อาการมากขึ้น"
]
},

{
id:"H11",
name:"สิ่งที่ทำให้อาการดีขึ้น",
keywords:[
"ดีขึ้น",
"อาการดีขึ้น",
"ช่วย",
"บรรเทา",
"ทำให้อาการดีขึ้น"
]
},

{
id:"H12",
name:"โรคประจำตัว / ยาที่ได้รับ",
keywords:[
"โรคประจำตัว",
"ยาประจำ",
"ยาที่ใช้",
"กินยาอะไร",
"ใช้ยาอะไร",
"ยาที่รับประทาน",
"ทุกวัน"
]
},

{
id:"H13",
name:"ประวัติสูบบุหรี่ / ดื่มแอลกอฮอล์",
keywords:[
"บุหรี่",
"สูบบุหรี่",
"เหล้า",
"ดื่มเหล้า",
"แอลกอฮอล์",
"สุรา"
]
},

{
id:"H14",
name:"ยา/ผลิตภัณฑ์อื่นที่ใช้บรรเทาอาการ",
keywords:[
"บรรเทาอาการ",
"รักษาอาการ",
"เคยกินยา",
"ซื้อยากิน",
"ใช้ผลิตภัณฑ์",
"ใช้ยาอะไร"
]
},

{
id:"H15",
name:"ประวัติแพ้ยา / แพ้สิ่งอื่น",
keywords:[
"แพ้ยา",
"แพ้อาหาร",
"แพ้อะไร",
"ประวัติแพ้",
"แพ้ยาอะไร"
]
},

{
id:"H16",
name:"เคยใช้ยานี้และมีอาการไม่พึงประสงค์",
keywords:[
"เคยใช้ยานี้",
"เคยกินยานี้",
"เคยทาน",
"เคยกิน",
"เคยใช้",
"ผลข้างเคียง",
"อาการไม่พึงประสงค์"
]
}

];



/* =====================================================
   COUNSELING C01-C04
===================================================== */

const counselingChecklist = [

{
id:"C01",
name:"วิธีใช้ยา",
keywords:[
"วิธีใช้",
"วิธีกิน",
"กินครั้งละ",
"หลังอาหาร",
"ก่อนอาหาร",
"ทานหลังอาหาร",
"ทานก่อนอาหาร"
]
},

{
id:"C02",
name:"ผลข้างเคียง",
keywords:[
"ผลข้างเคียง",
"อาการข้างเคียง",
"อาการไม่พึงประสงค์"
]
},

{
id:"C03",
name:"การเก็บรักษายา",
keywords:[
"เก็บยา",
"การเก็บรักษา",
"เก็บไว้",
"อุณหภูมิ"
]
},

{
id:"C04",
name:"การรักษาโดยไม่ใช้ยา / การดูแลตนเอง",
keywords:[
"ดูแลตัวเอง",
"ดูแลตนเอง",
"ไม่ใช้ยา",
"พักผ่อน",
"ดื่มน้ำ",
"ดูแล"
]
}

];



/* =====================================================
   VARIABLES
===================================================== */

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


const startBtn =
document.getElementById("startBtn");

const stopBtn =
document.getElementById("stopBtn");

const nextBtn =
document.getElementById("nextBtn");

const statusBox =
document.getElementById("status");

const transcriptBox =
document.getElementById("transcript");


let recognition;

let isListening = false;

let finalText = "";



/* =====================================================
   DISPLAY CHECKLIST
===================================================== */

function displayChecklist() {

const historyDiv =
document.getElementById("historyChecklist");

const counselingDiv =
document.getElementById("counselingChecklist");


historyDiv.innerHTML = "";

counselingDiv.innerHTML = "";


historyChecklist.forEach(item => {

const div =
document.createElement("div");

div.id = item.id;

div.className =
"check-item missing";

div.innerHTML =
"🔴 <b>" +
item.id +
"</b> — " +
item.name;

historyDiv.appendChild(div);

});


counselingChecklist.forEach(item => {

const div =
document.createElement("div");

div.id = item.id;

div.className =
"check-item missing";

div.innerHTML =
"🔴 <b>" +
item.id +
"</b> — " +
item.name;

counselingDiv.appendChild(div);

});

}


displayChecklist();



/* =====================================================
   CHECK KEYWORDS
===================================================== */

function checkChecklist(text) {

const lowerText =
text.toLowerCase();


let historyScore = 0;

let counselingScore = 0;


/* HISTORY */

historyChecklist.forEach(item => {

const found =
item.keywords.some(keyword =>
lowerText.includes(keyword.toLowerCase())
);


const div =
document.getElementById(item.id);


if(found) {

div.className =
"check-item done";

div.innerHTML =
"🟢 <b>" +
item.id +
"</b> — " +
item.name;

historyScore++;

} else {

div.className =
"check-item missing";

div.innerHTML =
"🔴 <b>" +
item.id +
"</b> — " +
item.name;

}

});


/* COUNSELING */

counselingChecklist.forEach(item => {

const found =
item.keywords.some(keyword =>
lowerText.includes(keyword.toLowerCase())
);


const div =
document.getElementById(item.id);


if(found) {

div.className =
"check-item done";

div.innerHTML =
"🟢 <b>" +
item.id +
"</b> — " +
item.name;

counselingScore++;

} else {

div.className =
"check-item missing";

div.innerHTML =
"🔴 <b>" +
item.id +
"</b> — " +
item.name;

}

});


document.getElementById("historyScore")
.innerText =
"คะแนนการซักประวัติ: " +
historyScore +
" / 16";


document.getElementById("counselingScore")
.innerText =
"คะแนนคำแนะนำยา: " +
counselingScore +
" / 4";


return {
historyScore,
counselingScore
};

}



/* =====================================================
   SPEECH RECOGNITION
===================================================== */

if(!SpeechRecognition) {

statusBox.innerText =
"❌ Browser ไม่รองรับ Speech Recognition";

startBtn.disabled = true;

} else {


recognition =
new SpeechRecognition();


recognition.lang =
"th-TH";


recognition.continuous =
true;


recognition.interimResults =
true;


recognition.maxAlternatives =
1;



/* START */

startBtn.onclick = function() {

finalText = "";

transcriptBox.innerText =
"กำลังรอฟังเสียง...";

isListening = true;

startBtn.disabled = true;

stopBtn.disabled = false;

nextBtn.disabled = true;


statusBox.innerText =
"🟡 กำลังเปิดระบบรับเสียง...";


try {

recognition.start();

} catch(error) {

console.log(error);

}

};



/* ON START */

recognition.onstart = function() {

console.log("Recognition started");

statusBox.innerText =
"🟢 กำลังฟังเสียง... พูดได้เลย";

};



/* ON RESULT */

recognition.onresult =
function(event) {


let interimText = "";


for(
let i = event.resultIndex;
i < event.results.length;
i++
) {


const transcript =
event.results[i][0].transcript;


if(event.results[i].isFinal) {

finalText +=
transcript + " ";

} else {

interimText +=
transcript;

}

}


/* แสดงข้อความ */

transcriptBox.innerText =
finalText + interimText;


/* ตรวจ Checklist */

checkChecklist(
finalText + interimText
);


nextBtn.disabled = false;


console.log(
"Transcript:",
finalText + interimText
);

};



/* ERROR */

recognition.onerror =
function(event) {

console.error(
"Speech Error:",
event.error
);


statusBox.innerText =
"❌ Speech Error: " +
event.error;

};



/* STOP */

stopBtn.onclick =
function() {

isListening = false;

recognition.stop();

startBtn.disabled = false;

stopBtn.disabled = true;

nextBtn.disabled = false;


statusBox.innerText =
"⏹️ หยุดรับเสียงแล้ว";

};



/* AUTO RESTART */

recognition.onend =
function() {

console.log(
"Recognition ended"
);


if(isListening) {

statusBox.innerText =
"🔄 กำลังเปิดการฟังใหม่...";


setTimeout(
function() {

try {

recognition.start();

} catch(error) {

console.log(error);

}

},
500
);

}

};

}



/* =====================================================
   NEXT
===================================================== */

nextBtn.onclick =
function() {


const result =
checkChecklist(finalText);


let missingHistory = [];

let missingCounseling = [];


/* Missing History */

historyChecklist.forEach(item => {

const found =
item.keywords.some(keyword =>
finalText.toLowerCase()
.includes(keyword.toLowerCase())
);


if(!found) {

missingHistory.push(
item.id + " — " + item.name
);

}

});


/* Missing Counseling */

counselingChecklist.forEach(item => {

const found =
item.keywords.some(keyword =>
finalText.toLowerCase()
.includes(keyword.toLowerCase())
);


if(!found) {

missingCounseling.push(
item.id + " — " + item.name
);

}

});


let html = "";


html +=
"<h3>📋 สรุปผล</h3>";


html +=
"<p><b>ซักประวัติ:</b> " +
result.historyScore +
" / 16</p>";


html +=
"<p><b>คำแนะนำยา:</b> " +
result.counselingScore +
" / 4</p>";


html +=
"<hr>";


html +=
"<h3>⚠️ หัวข้อซักประวัติที่ยังไม่พบ</h3>";


if(missingHistory.length === 0) {

html +=
"<p>🟢 ซักประวัติครบทุกหัวข้อ</p>";

} else {

html +=
"<ul>";

missingHistory.forEach(item => {

html +=
"<li>" + item + "</li>";

});

html +=
"</ul>";

}


html +=
"<h3>⚠️ หัวข้อคำแนะนำยาที่ยังไม่พบ</h3>";


if(missingCounseling.length === 0) {

html +=
"<p>🟢 ให้คำแนะนำครบทุกหัวข้อ</p>";

} else {

html +=
"<ul>";

missingCounseling.forEach(item => {

html +=
"<li>" + item + "</li>";

});

html +=
"</ul>";

}


document.getElementById("result")
.innerHTML = html;


/* Scroll ไปผลลัพธ์ */

document.getElementById("result")
.scrollIntoView({
behavior:"smooth"
});


};

function saveToGoogleSheet(
  transcript,
  historyScore,
  counselingScore,
  missingHistory,
  missingCounseling
) {

  const sessionId = "S" + Date.now();

  const params = new URLSearchParams({
    action: "save",
    callback: "pharmaCallback",

    sessionId: sessionId,

    transcript: transcript,

    historyScore: historyScore,

    counselingScore: counselingScore,

    missingHistory: missingHistory.join(" | "),

    missingCounseling: missingCounseling.join(" | ")
  });


  // รับคำตอบจาก Apps Script
  window.pharmaCallback = function(response) {

    console.log(
      "Apps Script response:",
      response
    );


    if (response.success) {

      console.log(
        "บันทึก Google Sheets สำเร็จ"
      );

      if (typeof statusBox !== "undefined") {

        statusBox.innerText =
          "✅ บันทึกข้อมูลลง Google Sheets แล้ว";

      }
    }

  };


  // สร้าง script สำหรับส่งข้อมูล
  const script =
    document.createElement("script");


  script.src =
    API_URL + "?" + params.toString();


  script.onload = function() {

    console.log(
      "ส่งข้อมูลไป Apps Script สำเร็จ"
    );

    script.remove();

  };


  script.onerror = function() {

    console.error(
      "ส่งข้อมูลไป Apps Script ไม่สำเร็จ"
    );

    if (typeof statusBox !== "undefined") {

      statusBox.innerText =
        "⚠️ ไม่สามารถบันทึก Google Sheets";

    }

    script.remove();

  };


  document.body.appendChild(script);

}

</script>

</body>

</html>
